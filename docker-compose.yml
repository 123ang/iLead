services:
  postgres:
    image: postgres:15-alpine
    container_name: ilead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ilead_db
      POSTGRES_USER: ilead_user
      POSTGRES_PASSWORD: password
    ports:
      - "55432:5432"
    volumes:
      - ilead_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilead_user -d ilead_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ilead_postgres_data:
